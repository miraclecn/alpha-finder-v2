thesis_id = "liquid_midcap_leader_continuation"
target_id = "open_t1_to_open_t20_net_cost"
required_data = [
  "weighted_momentum_quality",
  "industry_relative_strength",
  "trend_stability",
  "turnover_confirmation",
  "volume_overheat_control",
]
selection_logic = "liquid_midcap_weighted_momentum_rank_with_industry_binding"

[[components]]
descriptor_id = "weighted_momentum_quality"
