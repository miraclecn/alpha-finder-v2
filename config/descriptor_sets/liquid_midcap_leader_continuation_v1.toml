role = "within_industry_leadership"
weight = 0.25
transform = "industry_bucket_zscore"

[[components]]
descriptor_id = "trend_stability"
role = "path_quality_confirmation"
weight = 0.20
transform = "cross_sectional_zscore"

[[components]]
descriptor_id = "turnover_confirmation"
role = "liquidity_confirmation"
weight = 0.10
transform = "cross_sectional_zscore"

[[components]]
descriptor_id = "volume_overheat_control"
role = "overheat_penalty"
weight = 0.10
transform = "cross_sectional_zscore"

