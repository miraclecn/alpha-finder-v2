id = "leader_pullback_continuation"
name = "Leader Pullback Continuation"
family = "medium_alpha"
mechanism = "Stocks with medium-term absolute strength, within-industry leadership, orderly pullbacks, and healthy turnover confirmation often continue to outperform over the next multi-week holding window."
why_a_share = "A-share leadership often extends in a second leg when industry sponsorship remains intact, benchmark chasing keeps capital in the theme, and liquid leaders survive shallow pullbacks without breaking trend structure."
expected_sign = "positive"
expected_horizon_days = [10, 30]
required_data = [
  "medium_term_relative_strength",
  "industry_relative_strength",
  "trend_stability",
  "turnover_confirmation",
  "tradeability_state",
]
regime_dependencies = [
  "works better when industry leadership breadth remains intact",
  "should de-risk when industry concentration collapses or volatility spikes",
]
failure_modes = [
  "late_stage_blowoff_move",
  "single_theme_crowding",
  "industry_false_breakout",
]
falsification_rules = [
  "net_of_cost_active_ir_is_below_gate_threshold_across_the_registered_validation_window",
  "alpha_disappears_when_within_industry_leadership_is_forced_into_the_executable_path",
]
portfolio_role = "candidate medium-horizon alpha sleeve"

[validation]
primary_target = "20d_executable_net_return_interim"
cost_scenarios = ["base", "high"]
must_pass_regimes = ["bull", "bear", "high_dispersion", "low_dispersion"]
