id = "weighted_momentum_quality"
name = "Weighted Momentum Quality"
category = "price_trend"
signal_direction = "higher_is_better"
description = "Recent-price-weighted log-price regression momentum multiplied by path R-squared, adapted from ETF rotation to A-share stock selection."
required_data = ["daily_bar", "adj_factor"]
preferred_horizon_days = [10, 30]
normalization = ["cross_sectional", "winsorize", "zscore"]
point_in_time_rule = "use_only_price_history_visible_at_trade_date_close"
failure_modes = ["late_stage_gap_chase", "unstable_low_r2_trend"]

